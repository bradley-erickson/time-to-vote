<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>{% block title %}Time to Vote{% endblock %}</title>
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
</head>
<body>
  {% block content %}{% endblock %}
  <a href="/" class="kiosk-exit" id="kiosk-exit">exit</a>
  <script src="{{ static_url('dialog.js') }}"></script>
  <script>
    // In-page dialog, not window.confirm — native dialogs don't reliably show in fullscreen.
    document.getElementById('kiosk-exit').addEventListener('click', function (e) {
      e.preventDefault();
      ttvConfirm('End the voting session and return to the admin view?', {
        confirmLabel: 'Exit',
        cancelLabel: 'Stay',
      }).then(function (ok) {
        if (!ok) return;
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(function () {});
        }
        window.location.href = '/';
      });
    });
  </script>
</body>
</html>
